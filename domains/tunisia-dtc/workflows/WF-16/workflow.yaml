workflow:
  id: WF-16
  name: Response Renderer
  bounded_context: presentation
  version: 1.0.0
  purpose: Render customer-visible response from verified facts and approved language
    policy.
  dependencies:
  - WF-17
  security: No unverified price, stock, order or payment claims.
  inputs:
  - correlation_id
  - actor_context
  - domain_context
  - request_context
  outputs:
  - status
  - result
  - events
  - audit_reference
  state: durable domain state lives in Supabase; n8n execution state is transient
  idempotency: required for state-changing operations
  failure_policy: fail closed for authorization/security; reconcile unknown external
    outcomes
  observability:
  - correlation_id
  - workflow_id
  - workflow_version
  - policy_versions
  contracts:
  - contracts/platform/workflow.yaml
  - contracts/platform/action.yaml
