workflow:
  id: WF-01
  name: Security Gate
  bounded_context: security
  version: 1.0.0
  purpose: Validate signature/source, rate limits, replay protection and payload safety.
  dependencies:
  - WF-02
  security: Security gate precedes identity and reasoning.
  inputs:
  - correlation_id
  - actor_context
  - domain_context
  - request_context
  outputs:
  - status
  - result
  - events
  - audit_reference
  state: durable domain state lives in Supabase; n8n execution state is transient
  idempotency: required for state-changing operations
  failure_policy: fail closed for authorization/security; reconcile unknown external
    outcomes
  observability:
  - correlation_id
  - workflow_id
  - workflow_version
  - policy_versions
  contracts:
  - contracts/platform/workflow.yaml
  - contracts/platform/action.yaml
