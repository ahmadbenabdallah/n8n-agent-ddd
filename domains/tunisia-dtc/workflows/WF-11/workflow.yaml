workflow:
  id: WF-11
  name: Product Service
  bounded_context: commerce
  version: 1.0.0
  purpose: Retrieve verified product, variation, price and stock facts.
  dependencies:
  - WF-05
  - WF-12
  - WF-14
  security: Commerce source of truth is WooCommerce.
  inputs:
  - correlation_id
  - actor_context
  - domain_context
  - request_context
  outputs:
  - status
  - result
  - events
  - audit_reference
  state: durable domain state lives in Supabase; n8n execution state is transient
  idempotency: required for state-changing operations
  failure_policy: fail closed for authorization/security; reconcile unknown external
    outcomes
  observability:
  - correlation_id
  - workflow_id
  - workflow_version
  - policy_versions
  contracts:
  - contracts/platform/workflow.yaml
  - contracts/platform/action.yaml
