workflow:
  id: WF-08
  name: Escalation Engine
  bounded_context: escalation
  version: 1.0.0
  purpose: Create/route human handoff for risk, ambiguity, ownership or policy conditions.
  dependencies:
  - WF-03
  security: Human ownership blocks conflicting automation.
  inputs:
  - correlation_id
  - actor_context
  - domain_context
  - request_context
  outputs:
  - status
  - result
  - events
  - audit_reference
  state: durable domain state lives in Supabase; n8n execution state is transient
  idempotency: required for state-changing operations
  failure_policy: fail closed for authorization/security; reconcile unknown external
    outcomes
  observability:
  - correlation_id
  - workflow_id
  - workflow_version
  - policy_versions
  contracts:
  - contracts/platform/workflow.yaml
  - contracts/platform/action.yaml
