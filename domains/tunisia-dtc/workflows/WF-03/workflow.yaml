workflow:
  id: WF-03
  name: Conversation State
  bounded_context: state
  version: 1.0.0
  purpose: Load/update durable conversation state, language profile, intent context
    and human ownership.
  dependencies:
  - WF-04
  security: n8n execution history is not domain state.
  inputs:
  - correlation_id
  - actor_context
  - domain_context
  - request_context
  outputs:
  - status
  - result
  - events
  - audit_reference
  state: durable domain state lives in Supabase; n8n execution state is transient
  idempotency: required for state-changing operations
  failure_policy: fail closed for authorization/security; reconcile unknown external
    outcomes
  observability:
  - correlation_id
  - workflow_id
  - workflow_version
  - policy_versions
  contracts:
  - contracts/platform/workflow.yaml
  - contracts/platform/action.yaml
