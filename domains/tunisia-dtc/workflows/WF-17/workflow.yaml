workflow:
  id: WF-17
  name: Audit & Analytics
  bounded_context: audit
  version: 1.0.0
  purpose: Record important state changes, authorization decisions and execution evidence.
  dependencies:
  - WF-19
  security: Audit evidence does not grant authorization.
  inputs:
  - correlation_id
  - actor_context
  - domain_context
  - request_context
  outputs:
  - status
  - result
  - events
  - audit_reference
  state: durable domain state lives in Supabase; n8n execution state is transient
  idempotency: required for state-changing operations
  failure_policy: fail closed for authorization/security; reconcile unknown external
    outcomes
  observability:
  - correlation_id
  - workflow_id
  - workflow_version
  - policy_versions
  contracts:
  - contracts/platform/workflow.yaml
  - contracts/platform/action.yaml
