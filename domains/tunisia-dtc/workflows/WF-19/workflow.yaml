workflow:
  id: WF-19
  name: Maintenance & Monitoring
  bounded_context: operations
  version: 1.0.0
  purpose: Health checks, drift detection, reconciliation, stale execution detection
    and operational alerts.
  dependencies:
  - WF-15
  - WF-17
  - WF-20
  security: Unknown outcomes must reconcile before retry.
  inputs:
  - correlation_id
  - actor_context
  - domain_context
  - request_context
  outputs:
  - status
  - result
  - events
  - audit_reference
  state: durable domain state lives in Supabase; n8n execution state is transient
  idempotency: required for state-changing operations
  failure_policy: fail closed for authorization/security; reconcile unknown external
    outcomes
  observability:
  - correlation_id
  - workflow_id
  - workflow_version
  - policy_versions
  contracts:
  - contracts/platform/workflow.yaml
  - contracts/platform/action.yaml
