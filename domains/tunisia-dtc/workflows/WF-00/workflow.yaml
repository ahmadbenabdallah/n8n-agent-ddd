workflow:
  id: WF-00
  name: Inbound Gateway
  bounded_context: entry
  version: 1.0.0
  purpose: Receive Messenger/webhook input, normalize envelope, attach correlation
    context.
  dependencies:
  - WF-01
  security: No business mutation; reject malformed/oversized/untrusted envelopes.
  inputs:
  - correlation_id
  - actor_context
  - domain_context
  - request_context
  outputs:
  - status
  - result
  - events
  - audit_reference
  state: durable domain state lives in Supabase; n8n execution state is transient
  idempotency: required for state-changing operations
  failure_policy: fail closed for authorization/security; reconcile unknown external
    outcomes
  observability:
  - correlation_id
  - workflow_id
  - workflow_version
  - policy_versions
  contracts:
  - contracts/platform/workflow.yaml
  - contracts/platform/action.yaml
