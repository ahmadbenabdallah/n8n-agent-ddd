workflow:
  id: WF-12
  name: Cart Service
  bounded_context: commerce
  version: 1.0.0
  purpose: Read/update durable cart with validated product/variation/quantity and
    live price.
  dependencies:
  - WF-10
  - WF-11
  - WF-20
  security: Cart mutations require idempotency and verification.
  inputs:
  - correlation_id
  - actor_context
  - domain_context
  - request_context
  outputs:
  - status
  - result
  - events
  - audit_reference
  state: durable domain state lives in Supabase; n8n execution state is transient
  idempotency: required for state-changing operations
  failure_policy: fail closed for authorization/security; reconcile unknown external
    outcomes
  observability:
  - correlation_id
  - workflow_id
  - workflow_version
  - policy_versions
  contracts:
  - contracts/platform/workflow.yaml
  - contracts/platform/action.yaml
