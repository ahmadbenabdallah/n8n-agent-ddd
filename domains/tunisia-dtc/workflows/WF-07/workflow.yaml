workflow:
  id: WF-07
  name: Order Service
  bounded_context: orders
  version: 1.0.0
  purpose: Resolve order scope, status and permitted order operations.
  dependencies:
  - WF-02
  - WF-08
  - WF-15
  - WF-20
  security: Order scope is narrower than customer identity.
  inputs:
  - correlation_id
  - actor_context
  - domain_context
  - request_context
  outputs:
  - status
  - result
  - events
  - audit_reference
  state: durable domain state lives in Supabase; n8n execution state is transient
  idempotency: required for state-changing operations
  failure_policy: fail closed for authorization/security; reconcile unknown external
    outcomes
  observability:
  - correlation_id
  - workflow_id
  - workflow_version
  - policy_versions
  contracts:
  - contracts/platform/workflow.yaml
  - contracts/platform/action.yaml
