workflow:
  id: WF-09
  name: LLM Reasoning
  bounded_context: reasoning
  version: 1.0.0
  purpose: Generate structured proposals and response reasoning from approved context.
  dependencies:
  - WF-10
  - WF-16
  security: LLM is proposal-only; no direct execution.
  inputs:
  - correlation_id
  - actor_context
  - domain_context
  - request_context
  outputs:
  - status
  - result
  - events
  - audit_reference
  state: durable domain state lives in Supabase; n8n execution state is transient
  idempotency: required for state-changing operations
  failure_policy: fail closed for authorization/security; reconcile unknown external
    outcomes
  observability:
  - correlation_id
  - workflow_id
  - workflow_version
  - policy_versions
  contracts:
  - contracts/platform/workflow.yaml
  - contracts/platform/action.yaml
