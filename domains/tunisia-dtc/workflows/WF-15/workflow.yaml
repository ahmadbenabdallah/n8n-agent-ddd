workflow:
  id: WF-15
  name: Transaction/Payment
  bounded_context: payment
  version: 1.0.0
  purpose: Create/track transaction state and verify payment outcomes without storing
    payment secrets.
  dependencies:
  - WF-10
  - WF-17
  - WF-19
  security: Order creation is not payment; unknown outcomes reconcile.
  inputs:
  - correlation_id
  - actor_context
  - domain_context
  - request_context
  outputs:
  - status
  - result
  - events
  - audit_reference
  state: durable domain state lives in Supabase; n8n execution state is transient
  idempotency: required for state-changing operations
  failure_policy: fail closed for authorization/security; reconcile unknown external
    outcomes
  observability:
  - correlation_id
  - workflow_id
  - workflow_version
  - policy_versions
  contracts:
  - contracts/platform/workflow.yaml
  - contracts/platform/action.yaml
