name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f spec/releases/phase-12.5-runtime-release.yaml
          test -f spec/runtime/n8n-control-plane.yaml
          test -f spec/deployment/persistent-data-contract.yaml
          test "$(find domains/tunisia-dtc/workflows -mindepth 1 -maxdepth 1 -type d -name 'WF-*' | wc -l)" -eq 21
      - run: |
          bash -n scripts/release/create-manifest.sh
          bash -n scripts/release/verify-manifest.sh
          bash -n scripts/deployment/production-gate.sh
