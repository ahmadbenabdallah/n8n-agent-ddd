name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        type: string
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/release/create-manifest.sh "${{ inputs.version }}"
      - run: ./scripts/release/verify-manifest.sh "dist/release-manifest-${{ inputs.version }}.json"
      - run: |
          echo "Cryptographic signing must be connected to the chosen trusted signing service."
          echo "This workflow intentionally does not fake a signature."
