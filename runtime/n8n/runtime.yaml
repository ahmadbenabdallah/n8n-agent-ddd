version: "1"

runtime:
  engine: n8n
  deployment_mode: self-hosted
  state_externalized: true

configuration:
  execution_data_retention: bounded
  workflow_source_of_truth: git
  credentials_source: runtime_secret_store

deployment:
  strategy: blue_green
  health_check_required: true
  smoke_test_required: true
  rollback_enabled: true
  drain_timeout_seconds: 300

boundaries:
  privileged_execution_workflow: WF-20
  authorization_workflow: WF-10
