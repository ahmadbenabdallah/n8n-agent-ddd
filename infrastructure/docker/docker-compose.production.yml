services:
  reverse-proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - n8n
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    networks: [edge, private]

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    env_file:
      - ../../environments/production.env
    environment:
      N8N_HOST: ${N8N_HOST:?set N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      DB_TYPE: postgresdb
      DB_POSTGRESDB_CONNECTION_STRING: ${DATABASE_URL:?set DATABASE_URL}
      QUEUE_BULL_REDIS_HOST: redis
      EXECUTIONS_MODE: queue
      # Required by the inbound webhook signature check (Code node, node:crypto).
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
    depends_on:
      - redis
    networks: [private]

  n8n-worker:
    image: n8nio/n8n:latest
    restart: unless-stopped
    env_file:
      - ../../environments/production.env
    command: worker
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_CONNECTION_STRING: ${DATABASE_URL:?set DATABASE_URL}
      QUEUE_BULL_REDIS_HOST: redis
      EXECUTIONS_MODE: queue
      # Required by the inbound webhook signature check (Code node, node:crypto).
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
    depends_on:
      - redis
    networks: [private]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [private]

networks:
  edge:
  private:
    internal: true

volumes:
  redis_data:
