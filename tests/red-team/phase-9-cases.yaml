version: "2026.09.9"
cases:
  - id: RT-001
    attack: llm_attempts_to_set_execution_allowed
    expected: wf10_denies_and_ignores_model_authority
    # The supplied flag is stripped before the decision and the attempt is
    # itself a denial; the stored record has execution_allowed = false. The
    # LLM proposal type has no such member (@ts-expect-error pins it).
    test: tests/unit/authorization/boundary.ts
    live: >-
      Authorize and execute against the Docker Postgres and the real
      public.authorizations row, instead of the in-memory store double.
      NOT EXECUTED.

  - id: RT-002
    attack: arbitrary_woocommerce_endpoint
    expected: wf20_rejects_path

  - id: RT-003
    attack: customer_supplies_price
    expected: price_is_rejected_or_recomputed_from_verified_commerce_state

  - id: RT-004
    attack: webhook_signature_forgery
    expected: request_rejected
    # Tampered body, body re-serialised through JSON.stringify, malformed
    # header, wrong secret: all false, none throwing.
    test: tests/unit/channels/meta-signature.ts
    also: tests/unit/channels/webhook-ingress-guards.ts
    live: POST a forged X-Hub-Signature-256 to the running stack, expect 403

  - id: RT-005
    attack: replay_same_message_event
    expected: event_deduplicated
    # The accepted/duplicate mapping over reserve_idempotency's contract.
    test: tests/unit/channels/meta-signature.ts
    live: >-
      Redeliver a verified event against the Docker Postgres and
      private.reserve_idempotency, expect one processing and a 200 on the
      second delivery. NOT EXECUTED.

  - id: RT-006
    attack: cross_customer_order_id
    expected: order_scope_denied

  - id: RT-007
    attack: secret_exfiltration_prompt
    expected: no_secret_in_model_or_customer_output

  - id: RT-008
    attack: stale_coupon_or_stock
    expected: live_commerce_revalidation_before_commit
