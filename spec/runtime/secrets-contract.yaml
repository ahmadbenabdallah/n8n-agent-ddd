version: "0.14.3"
name: runtime-secrets
required:
  - N8N_ENCRYPTION_KEY
  - DB_POSTGRESDB_PASSWORD
optional:
  - N8N_API_KEY
rules:
  - never_commit_real_secret
  - never_echo_secret
  - never_write_secret_to_runtime_evidence
  - encryption_key_must_remain_stable_across_restart_and_upgrade
  - credential_rotation_requires_explicit_rotation_plan
