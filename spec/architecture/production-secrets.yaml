version: 1
secret_classes:
  ci:
    examples: [deploy_credentials, registry_credentials]
    repository_storage: forbidden
  deployment:
    examples: [ssh_or_deploy_identity]
    runtime_storage: forbidden
  runtime:
    examples:
      - database_credentials
      - openai_credentials
      - commerce_credentials
      - channel_credentials
    git_storage: forbidden
    llm_context: forbidden
    customer_output: forbidden
rules:
  - inject_at_runtime
  - rotate_without_source_change
  - audit_access
  - never_log_secret_values
  - never_put_secret_in_workflow_json
