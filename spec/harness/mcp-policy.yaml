version: "0.17.0"
principles:
  capability_discovery_is_not_authorization: true
  mcp_is_control_interface_not_policy_authority: true
  policy_layer_must_evaluate_high_impact_actions: true

protected_actions:
  - "WF-01 mutation"
  - "WF-10 mutation"
  - "WF-15 mutation"
  - "WF-20 mutation"
  - "production traffic switch"
  - "secret export"

allowed_control_examples:
  - "inspect workflow"
  - "validate workflow"
  - "read non-secret runtime status"
  - "build synchronization plan"
  - "run tests"
