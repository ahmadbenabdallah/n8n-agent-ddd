phase:
  id: "18.0"
  name: "Agent-Installable Platform"
  status: "foundation"
  objective: "Make the platform safely installable, configurable, testable, and deployable by Claude Code/Codex through the Harness control plane."
boundaries:
  harness_is_developer_and_ai_agent_control_plane: true
  harness_is_not_customer_runtime: true
  harness_is_not_workflow_editor: true
  n8n_native_dashboard_remains_operator_ui: true
  capability_discovery_is_not_authorization: true
  coding_agents_must_not_ssh_directly_to_production: true
  production_requires_certification_and_explicit_approval: true
requirements:
  install:
    idempotent: true
    environment_aware: true
    provider_neutral: true
    safe_to_rerun: true
  doctor:
    detects_prerequisites: true
    validates_configuration_shape: true
    never_prints_secrets: true
  configure:
    uses_runtime_configuration_contract: true
    uses_secrets_contract: true
    validates_without_leaking_values: true
  bootstrap:
    supports_claude_code: true
    supports_codex: true
    uses_git_and_ci_boundaries: true
  delegation:
    develop_routes_to_existing_harness_controls: true
    test_routes_to_existing_test_gates: true
    security_routes_to_existing_security_gates: true
    validate_routes_to_existing_validation_gates: true
    deploy_routes_to_existing_deployment_gates: true
gates:
  contract: "tests/harness/phase18-contract.sh"
  live_installation: "NOT_EXECUTED"
  live_provider_deployment: "NOT_EXECUTED"
  live_production_deployment: "NOT_EXECUTED"
truth:
  production_certification_not_asserted: true
  no_live_execution_claimed: true
