workflow:
  id: WF-XX
  name: <Workflow name>
  bounded_context: <context-id>
  version: 0.1.0
  purpose: <What this workflow does.>
  dependencies:
  - WF-10                       # when it needs an authorized action
  security: <The boundary this workflow must never cross.>
  inputs:
  - correlation_id
  - actor_context
  - domain_context
  - request_context
  outputs:
  - status
  - result
  - events
  - audit_reference
  state: durable domain state lives in Postgres; n8n execution state is transient
  idempotency: required for state-changing operations
  failure_policy: fail closed for authorization/security; reconcile unknown external outcomes
  observability:
  - correlation_id
  - workflow_id
  - workflow_version
  - policy_versions
  contracts:
  - contracts/platform/workflow.yaml
  - contracts/platform/action.yaml
