domain: <your-domain-id>
version: <YYYY.MM.N>
# Workflows the domain uses. Keep the platform-required ones and add your domain workflows (sales, support, booking...).
# Executable n8n JSON lives in runtime/n8n/workflows/; this folder holds the contracts.
workflows:
- id: WF-00
  name: Inbound Gateway
  category: ingress
- id: WF-01
  name: Security Gate
  category: security
- id: WF-09
  name: LLM Reasoning
  category: reasoning
- id: WF-10
  name: Action Authorization
  category: authorization
- id: WF-16
  name: Response Renderer
  category: rendering
- id: WF-17
  name: Audit & Analytics
  category: audit
- id: WF-19
  name: Maintenance & Monitoring
  category: operations
- id: WF-XX
  name: <Domain workflow>
  category: domain
