domain:
  id: <your-domain-id>          # stable, lowercase, e.g. tunisia-dtc
  name: <Human-readable name>
  version: "<YYYY.MM.N>"
  purpose: >
    <Who the agent serves, on which channels, doing what.>

bounded_contexts:
  - id: <context-id>
    responsibility: <What this context owns.>
  - id: governance              # platform-required
    responsibility: Authorization, audit, reconciliation and monitoring.

actors:
  - customer
  - human_agent
  - autonomous_agent
  - operator
  - <external system, e.g. commerce platform or channel>

identity_ladder:                # lowest to highest assurance; see domains/tunisia-dtc/domain.yaml
  - ANONYMOUS
  - <LEVEL>

language_policy:
  default:
    language: <language code>

sources_of_truth:
  domain_state: postgres        # provider profile (Supabase or another Postgres) is set in domain-project.yaml
  commerce: <commerce system, or none>
  orchestration: n8n
  reasoning: llm
  authorization: WF-10                    # platform-required
  privileged_commerce_execution: WF-20    # platform-required when the domain mutates commerce
  audit: WF-17                            # platform-required
  monitoring_and_reconciliation: WF-19    # platform-required

runtime_invariants:             # platform-required; defined in spec/invariants/platform.yaml
  - AUTH-001
  - AUTH-002
  - EXEC-001
  - DATA-001
  - SECRET-001
  - IDEMP-001
  - RECON-001
  - AUDIT-001
  - HUMAN-001
