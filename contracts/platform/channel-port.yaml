version: "2026.09.10"
name: ChannelPort

operations:
  inbound:
    - verify
    - normalize
  outbound:
    - send_text
    - send_media
    - send_interactive

normalization:
  input: provider_event
  output: CanonicalMessage

security:
  - provider_signature_verified_before_processing
  - provider_credentials_never_enter_domain_payload
  - external_user_id_is_not_customer_identity
